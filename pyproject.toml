[project]
name = "qctn"
version = "0.0.1"
description = "Python reproduction of arXiv 2608.05819: learning to rank tensor network contraction plans"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "networkx==3.7",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "openpyxl==3.1.5",
    "xgboost==2.1.4",
    "cotengra==0.8.3",
    "qiskit==2.6.1",
]

[project.optional-dependencies]
# CUDA 12 only: driver 535 on DGX106, and CUDA 13 has dropped Volta (V100).
gpu = ["cupy-cuda12x[ctk]==14.2.0"]
# Manim needs pango and cairo headers, which DGX106 lacks; see container/README.md.
slides = ["manim==0.21.0"]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qctn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

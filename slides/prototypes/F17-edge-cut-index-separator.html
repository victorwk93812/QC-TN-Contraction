<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F17 · Bond cut of the tensor graph = vertex separator of the index graph</title>
<link rel="stylesheet" href="shim.css">

<div class="proto-note">Chat prototype for F17. Reference for layout, colour roles and interaction only: numbers here are hand-placed or computed in the browser; the deck must read them from traces.</div>
<svg width="100%" viewBox="0 0 680 260" role="img">
<title>An edge cut of the tensor graph is a vertex separator of the index graph</title>
<desc>Left: a 2 by 3 grid of tensors split into left and right groups; bonds p and q cross. Right: removing p and q from the index graph disconnects left indices from right indices.</desc>
<text class="th" x="170" y="24" text-anchor="middle">Tensor graph: edge cut</text>
<text class="th" x="510" y="24" text-anchor="middle">Index graph: vertex separator</text>
<g stroke="#B4B2A9" stroke-width="1.5">
<line x1="70" y1="80" x2="160" y2="80"/><line x1="70" y1="180" x2="160" y2="180"/>
<line x1="70" y1="80" x2="70" y2="180"/><line x1="160" y1="80" x2="160" y2="180"/>
<line x1="250" y1="80" x2="250" y2="180"/>
</g>
<g stroke="#D85A30" stroke-width="2.5">
<line x1="160" y1="80" x2="250" y2="80"/><line x1="160" y1="180" x2="250" y2="180"/>
</g>
<line x1="205" y1="50" x2="205" y2="210" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<text class="ts" x="115" y="72" text-anchor="middle">a</text><text class="ts" x="115" y="198" text-anchor="middle">b</text>
<text class="ts" x="58" y="134" text-anchor="end">c</text><text class="ts" x="172" y="134">d</text>
<text class="ts" x="262" y="134">e</text>
<text class="ts" x="205" y="72" text-anchor="middle" fill="#993C1D">p</text>
<text class="ts" x="205" y="198" text-anchor="middle" fill="#993C1D">q</text>
<g class="c-purple">
<rect x="56" y="66" width="28" height="28" rx="4" stroke-width="0.5"/><rect x="146" y="66" width="28" height="28" rx="4" stroke-width="0.5"/>
<rect x="56" y="166" width="28" height="28" rx="4" stroke-width="0.5"/><rect x="146" y="166" width="28" height="28" rx="4" stroke-width="0.5"/>
</g>
<g class="c-teal">
<rect x="236" y="66" width="28" height="28" rx="4" stroke-width="0.5"/><rect x="236" y="166" width="28" height="28" rx="4" stroke-width="0.5"/>
</g>
<g stroke="#B4B2A9" stroke-width="1.2">
<line x1="400" y1="70" x2="370" y2="130"/><line x1="400" y1="70" x2="455" y2="130"/>
<line x1="400" y1="190" x2="370" y2="130"/><line x1="400" y1="190" x2="455" y2="130"/>
<line x1="400" y1="70" x2="510" y2="70"/><line x1="455" y1="130" x2="510" y2="70"/>
<line x1="400" y1="190" x2="510" y2="190"/><line x1="455" y1="130" x2="510" y2="190"/>
<line x1="510" y1="70" x2="610" y2="130"/><line x1="510" y1="190" x2="610" y2="130"/>
</g>
<g class="c-purple">
<circle cx="400" cy="70" r="14" stroke-width="0.5"/><circle cx="400" cy="190" r="14" stroke-width="0.5"/>
<circle cx="370" cy="130" r="14" stroke-width="0.5"/><circle cx="455" cy="130" r="14" stroke-width="0.5"/>
<text class="th" x="400" y="70" text-anchor="middle" dominant-baseline="central">a</text>
<text class="th" x="400" y="190" text-anchor="middle" dominant-baseline="central">b</text>
<text class="th" x="370" y="130" text-anchor="middle" dominant-baseline="central">c</text>
<text class="th" x="455" y="130" text-anchor="middle" dominant-baseline="central">d</text>

<circle cx="510" cy="70" r="14" stroke-width="1.5"/><circle cx="510" cy="190" r="14" stroke-width="1.5"/>
<text class="th" x="510" y="70" text-anchor="middle" dominant-baseline="central">p</text>
<text class="th" x="510" y="190" text-anchor="middle" dominant-baseline="central">q</text>
</g>
<g class="c-teal">
<circle cx="610" cy="130" r="14" stroke-width="0.5"/>
<text class="th" x="610" y="130" text-anchor="middle" dominant-baseline="central">e</text>
</g>
<text class="ts" x="170" y="240" text-anchor="middle">cut bonds p, q = open legs of each half</text>
<text class="ts" x="510" y="240" text-anchor="middle">removing p, q disconnects left from right</text>
</svg>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F24 · Kernel trick: two routes to the same scalar</title>
<link rel="stylesheet" href="shim.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
</head><body>
<div class="proto-note">Chat prototype for F24. Reference for layout, colour roles and interaction only: numbers here are hand-placed or computed in the browser; the deck must read them from traces.</div>
<svg width="100%" viewBox="0 0 680 330" role="img">
<title>The kernel trick: two routes to the same scalar</title>
<desc>From a pair of raw inputs, one route maps each into an exponentially large feature space and takes their inner product; the other evaluates the kernel directly. Both produce the same number.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text class="th" x="210" y="36">Explicit route</text>
<text class="th" x="210" y="210">Kernel route</text>
<g class="c-gray">
<rect x="40" y="130" width="110" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="152" text-anchor="middle" dominant-baseline="central">x, x′</text>
<text class="ts" x="95" y="172" text-anchor="middle" dominant-baseline="central">raw inputs</text>
</g>
<path d="M152 150 H170 V78 H206" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M152 170 H170 V250 H206" class="arr" fill="none" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="210" y="50" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="310" y="70" text-anchor="middle" dominant-baseline="central">Λ(x), Λ(x′)</text>
<text class="ts" x="310" y="88" text-anchor="middle" dominant-baseline="central">2ᴺ components each</text>
</g>
<text class="ts" x="310" y="130" text-anchor="middle">intractable to store or contract</text>
<g class="c-teal">
<rect x="210" y="222" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="310" y="242" text-anchor="middle" dominant-baseline="central">K(x, x′)</text>
<text class="ts" x="310" y="260" text-anchor="middle" dominant-baseline="central">N small dot products</text>
</g>
<text class="ts" x="310" y="306" text-anchor="middle">O(N) per pair, no feature vector built</text>
<path d="M412 78 H545 V126" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M412 250 H545 V198" class="arr" fill="none" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="450" y="130" width="190" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="152" text-anchor="middle" dominant-baseline="central">Same scalar</text>
<text class="ts" x="545" y="172" text-anchor="middle" dominant-baseline="central">Λ(x)ᵀΛ(x′) = K(x, x′)</text>
</g>
</svg>

</body></html>

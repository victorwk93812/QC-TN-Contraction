name: container
# Builds the toolchain image and publishes it to GitHub Container Registry.
on:
  push:
    branches: [main]
    paths:
      - container/Dockerfile
      - .dockerignore
      - slides/requirements.txt
      - slides/package.json
      - slides/package-lock.json
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: true
          tags: |
            ghcr.io/victorwk93812/qc-tn-toolchain:latest
            ghcr.io/victorwk93812/qc-tn-toolchain:${{ github.sha }}
